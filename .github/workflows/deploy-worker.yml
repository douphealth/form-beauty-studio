name: Deploy audit Worker

# Ships the Stripe checkout and audit Worker (workers/audit-proxy).
#
# The deploy job runs only after the app tests, the Worker typecheck and a bundle
# dry-run all pass, and only from main. It is skipped, with a notice, until a
# CLOUDFLARE_API_TOKEN repository secret exists.
#
# Stripe and entitlement secrets are never handled here. They are set once in
# Cloudflare with `wrangler secret put` and survive every redeploy.

on:
  push:
    branches:
      - main
    paths:
      - "workers/audit-proxy/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-audit-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: App and Worker tests
        run: |
          npm ci
          npm test
      - name: Worker typecheck and bundle dry-run
        working-directory: workers/audit-proxy
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: workers/audit-proxy
        run: npm ci
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workers/audit-proxy
        run: npx wrangler deploy
      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set. The Worker passed every check but was not deployed."
